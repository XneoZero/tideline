name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r integrations/astrbot_plugin_tideline/requirements.txt ruff
      - run: python -m unittest discover -s test -p 'test_astrbot_client.py'
      - run: ruff check integrations/astrbot_plugin_tideline test/test_astrbot_client.py
      - run: ruff format --check integrations/astrbot_plugin_tideline test/test_astrbot_client.py
